name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Os testes de integracao rodam contra H2 em memoria, entao o CI nao
      # precisa de servico de PostgreSQL - build mais rapido e menos fragil.
      - name: Build e testes
        run: mvn -B clean verify

      - name: Publicar resultado dos testes
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Testes
          path: target/surefire-reports/*.xml
          reporter: java-junit
