# Testes de integracao rodam contra H2 em memoria - sem depender de PostgreSQL
# instalado na maquina nem no CI.
spring.datasource.url=jdbc:h2:mem:apurador;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Os testes rodam as MESMAS migracoes Flyway da producao, contra H2 em modo
# PostgreSQL. Isso transforma cada execucao da suite numa verificacao de que as
# migracoes aplicam limpo - erro de SQL na migracao quebra o build, nao o deploy.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.clean-disabled=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# A semente ficticia nao roda nos testes: cada teste monta a tabela que precisa.
apurador.seed-ficticio=false
