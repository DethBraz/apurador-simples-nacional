spring.application.name=apurador-simples

# Banco - sobrescrito por variaveis de ambiente no docker-compose
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/apurador}
spring.datasource.username=${DB_USER:apurador}
spring.datasource.password=${DB_PASSWORD:apurador}

# O schema e criado pelo Flyway (src/main/resources/db/migration).
#
# validate faz o Hibernate CONFERIR que as entidades batem com o schema e falhar
# na subida se divergirem. E uma rede de seguranca real: entidade alterada sem a
# migracao correspondente derruba a aplicacao no deploy, em vez de estourar em
# producao no primeiro insert.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

server.port=${PORT:8080}
